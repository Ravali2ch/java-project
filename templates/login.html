
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - ReUseLoop</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eaf5ed;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        .logo {
            text-align: center;
            color: #176b45;
            font-size: 28px;
            font-weight: bold;
        }

        h2 {
            text-align: center;
            color: #176b45;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #176b45;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #176b45;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #105235;
        }

        .message {
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 5px;
            background: #fde8e8;
            color: #a52a2a;
            text-align: center;
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
        }

        .register-link a,
        .home-link a {
            color: #176b45;
            text-decoration: none;
            font-weight: bold;
        }

        .home-link {
            text-align: center;
            margin-top: 18px;
        }
    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">♻️ ReUseLoop</div>

    <h2>Welcome Back!</h2>

    <p class="subtitle">Login to your ReUseLoop account</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">

        <label for="email">Email Address</label>

        <input
            type="email"
            id="email"
            name="email"
            placeholder="Enter your email"
            required
        >

        <label for="password">Password</label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Login</button>

    </form>

    <div class="register-link">
        Don't have an account?
        <a href="{{ url_for('register') }}">Register Now</a>
    </div>

    <div class="home-link">
        <a href="{{ url_for('home') }}">← Back to Home</a>
    </div>

</div>

</body>
</html>
